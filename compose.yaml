# OrderMyPhotos on one host: the web app (`omp serve`), a wizard that runs one session at a time over a
# root directory and pauses for the reviewer (docs/design.md S13, decisions P43, P44, P47). From a clone:
#   docker compose -p omp --env-file deploy/mimir.env up -d --build
# The code is mounted from ./src. Deploy a change with `git pull` and `docker compose -p omp --env-file deploy/mimir.env
# restart`: pages are read on every request, but the server's Python only at start (`up -d` alone doesn't restart
# it). A restart is safe, since a running pipeline stops cleanly and resumes. Rebuild only when docker/ changes.
# Host network: it calls llama-swap on 127.0.0.1:9292 and listens on 127.0.0.1:$OMP_WEB_PORT only.
services:
  omp:
    image: omp:0.2
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["serve"]
    init: true                    # signals reach `omp serve`, which stops the pipeline cleanly
    restart: unless-stopped
    stop_grace_period: 90s
    network_mode: host
    user: "${OMP_UID:-1001}:${OMP_GID:-1002}"
    group_add: ["${OMP_RENDER_GID:-990}"]
    devices:  # the B50 only: the NVIDIA CDI device breaks Level Zero; models on the 4090 run under llama-swap
      - ${OMP_B50:-/dev/dri/b50-render}:/dev/dri/renderD128
    environment:
      OMP_STATE_DIR: /state                              # sessions: DB, status, review state, log
      OMP_SESSIONS_CACHE: /cache                         # sessions: previews and the review bundle
      OMP_ROOTS: ${OMP_ROOTS:?}                          # where a session's root may be, as host paths
      OMP_APPLY_ROOTS: ${OMP_APPLY_ROOTS:?}              # where a plan may be applied: copies, never OneDrive
      OMP_MODELS: /models
      OMP_MANIFESTS: /manifests
      OMP_WORKERS: ${OMP_WORKERS:-20}
      OMP_WEB_PORT: ${OMP_WEB_PORT:-8790}
      OMP_LLM: ${OMP_LLM:-http://127.0.0.1:9292}
      OMP_4090: ${OMP_4090:-1}                           # the 4090 helps the B50 stages in idle stretches (P49)
      OMP_4090_IDLE: ${OMP_4090_IDLE:-900}               # seconds without a chat token before it's borrowed
      OMP_GPU_STATS: /run/mimir-gpu/stats.json           # the 4090 and the B50's VRAM, from the host (mimir-gpu-stats)
      OMP_B50_PCI: ${OMP_B50_PCI:-0000:0e:00.0}
      HF_HOME: /models/hf
      PYTHONPATH: /code
    volumes:
      - ${OMP_STATE:?}:/state
      - ${OMP_SESSIONS_CACHE_DIR:?}:/cache
      - ${OMP_MODELS_DIR:?}:/models
      - ${OMP_MANIFESTS_DIR:?}:/manifests:ro
      - ./src:/code:ro
      - /run/mimir-gpu:/run/mimir-gpu:ro
      # The libraries, at the same paths as on the host: a session's root is picked by its host path. OneDrive is
      # read-only (its plan goes to OneDrive itself); the test sets are copies, so their plan is applied in them.
      - ${OMP_LIBRARIES_A:?}:${OMP_LIBRARIES_A}:ro
      - ${OMP_LIBRARIES_B:?}:${OMP_LIBRARIES_B}
