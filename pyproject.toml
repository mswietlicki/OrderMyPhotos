[project]
name = "omp"
version = "0.1.0"
description = "OrderMyPhotos v2: cull, organize and describe a private photo library with local models"
requires-python = ">=3.13"
# Runtime dependencies are pinned in docker/requirements.txt and docker/Dockerfile (torch XPU build).
dependencies = []

[project.scripts]
omp = "omp.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omp = ["*.yaml", "*.html", "*.svg"]

[tool.ruff]
line-length = 120
target-version = "py313"
