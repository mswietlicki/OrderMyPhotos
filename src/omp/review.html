<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · OrderMyPhotos</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --fg: #1d2129; --muted: #667085; --line: #e4e7ec; --soft: #eef2f8;
          --accent: #2f6fde; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1b1e23; --fg: #e6e8eb; --muted: #98a2b3; --line: #2c3038; --soft: #232831;
            --accent: #6b9cff; --ok: #4cc38a; --warn: #e0a84a; --bad: #ef6b5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; padding: 10px 16px;
           background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header a { color: var(--accent); text-decoration: none; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 4px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--soft); color: var(--fg); font-weight: 600; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 52px); }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } aside { max-height: 40vh; } }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--card); }
  aside input { margin: 10px; width: calc(100% - 20px); }
  .unit { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .unit:hover { background: var(--soft); } .unit.sel { background: var(--soft); box-shadow: inset 3px 0 var(--accent); }
  .unit .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unit .s { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.open { background: var(--warn); } .dot.confirmed { background: var(--ok); } .dot.dismantled { background: var(--muted); }
  section.main { padding: 14px 18px 60px; min-width: 0; }
  .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .head input.name { font-size: 18px; font-weight: 650; border: 1px solid transparent; background: none; color: var(--fg); padding: 4px 6px; border-radius: 6px; min-width: 240px; }
  .head input.name:hover, .head input.name:focus { border-color: var(--line); background: var(--card); }
  .path { color: var(--muted); font-size: 12px; margin: 2px 6px 10px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  button, input, select { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); } button:disabled { opacity: .4; }
  .summary { color: var(--muted); margin: 6px 0 12px; }
  /* every photo sits in the same frame, a burst's dashed and labelled on its border, so all line up in rows */
  .grid { display: flex; flex-wrap: wrap; gap: 14px 8px; padding-top: 4px; }
  .burst, .solo { position: relative; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid transparent; border-radius: 10px; }
  .burst { border: 1px dashed var(--line); }
  .burst > .lbl { position: absolute; top: -8px; left: 10px; padding: 0 5px; font-size: 11px; line-height: 14px; color: var(--muted); background: var(--bg); }
  .ph { position: relative; width: var(--size, 150px); height: var(--size, 150px); border-radius: 8px; overflow: hidden; cursor: pointer;
        outline: 3px solid transparent; outline-offset: -3px; background: var(--soft);
        scroll-margin: 70px 0 24px; }  /* the sticky header doesn't cover a selected photo */
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .15s; }
  .ph.archive img { opacity: .35; filter: grayscale(.6); }
  .ph.archive { outline-color: var(--bad); }
  .ph.archive::before { content: "archived"; position: absolute; left: 4px; bottom: 4px; z-index: 1; padding: 1px 6px; border-radius: 999px;
                        background: var(--bad); color: #fff; font-size: 10px; font-weight: 600; }
  .ph.out img { opacity: .2; } .ph.out::after { content: "out"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--bad); }
  .ph.moved::after { content: "→ " attr(data-to); position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 4px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ph.focus { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }  /* outside the red one, so both show */
  .ph .b { position: absolute; top: 4px; left: 4px; display: flex; gap: 3px; }
  .ph .b span { font-size: 10px; padding: 1px 5px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
  .ph .b .new { background: var(--accent); } .ph .b .uns { background: var(--warn); }
  .ph .tools { position: absolute; top: 4px; right: 4px; display: none; gap: 3px; }
  .ph:hover .tools { display: flex; } .ph .tools button { padding: 1px 6px; font-size: 12px; background: rgba(0,0,0,.65); color: #fff; border: 0; }
  details.done { margin-top: 18px; } details.done summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }
  .help { color: var(--muted); font-size: 12px; margin-top: 18px; } kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  /* the large view fills the screen, the photo above a caption bar of fixed height: going from photo to
     photo, nothing changes size */
  #big { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; border-radius: 0;
         background: #000; color: #e6e8eb; overflow: hidden; }
  #big[open] { display: flex; flex-direction: column; }
  #bigMain { flex: 1; min-height: 0; display: flex; }
  #bigBox { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  /* the shown photo's own state, on it: a red frame and a badge when it's archived or taken out */
  #bigBox.archive, #bigBox.out { box-shadow: inset 0 0 0 4px #ef6b5b; }
  #bigBadge { position: absolute; top: 14px; left: 14px; z-index: 2; padding: 4px 12px; border-radius: 999px; background: #c0392b;
              color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .03em; display: none; }
  #bigBox.archive #bigBadge, #bigBox.out #bigBadge { display: block; }
  /* on-screen controls: previous and next on the photo's edges, close in its corner, actions in the bar */
  #bigBox .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 96px; border: 0; border-radius: 10px;
                 background: rgba(0, 0, 0, .35); color: #fff; font-size: 40px; line-height: 1; cursor: pointer; opacity: .7; z-index: 2; }
  #bigBox .nav:hover { opacity: 1; background: rgba(0, 0, 0, .65); } #bigBox .nav:disabled { opacity: .15; cursor: default; }
  #bigBox .prev { left: 10px; } #bigBox .next { right: 10px; }
  #bigBox .close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 0;
                   background: rgba(0, 0, 0, .55); color: #fff; font-size: 20px; cursor: pointer; z-index: 2; }
  #bigBox .close:hover { background: rgba(0, 0, 0, .85); }
  #bigBar { flex: none; height: 112px; display: flex; background: #15171b; border-top: 1px solid #2c3038; }
  #bigActs { flex: none; display: flex; gap: 8px; align-items: center; padding: 10px 16px; }
  #bigActs button { background: #23272e; color: #e6e8eb; border: 1px solid #3a3f48; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  #bigActs button:hover { background: #2c323b; } #bigActs button.on-archive { border-color: #ef6b5b; } #bigActs button.on-keep { border-color: #4cc38a; }

  /* the burst, on the right: always there and as wide, so the photo keeps its size from photo to photo */
  /* the scrollbar's room is kept, so many frames never make it scroll sideways or change its width */
  #bigBurst { flex: none; width: 212px; overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable; padding: 10px;
              background: #15171b; border-left: 1px solid #2c3038; display: flex; flex-direction: column; gap: 8px;
              align-items: stretch; font-size: 12px; color: #98a2b3; }
  #bigImg { position: absolute; top: 50%; left: 50%; object-fit: contain; }
  #big .info { flex: 1; min-width: 0; overflow: auto; padding: 10px 16px; }
  #big .info .muted { color: #98a2b3; font-size: 12px; } #big a { color: #6b9cff; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); } #bigInfo b.keep { color: var(--ok); } #bigInfo b.archive { color: var(--bad); }
  #big kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
  #bigBurst img { width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; outline: 2px solid transparent; outline-offset: -2px; flex: none; }
  #bigBurst img { border: 3px solid transparent; }
  #bigBurst img.archive, #bigBurst img.out { opacity: .45; filter: grayscale(.6); border-color: #ef6b5b; }
  #bigBurst img.cur { outline: 3px solid #6b9cff; outline-offset: 2px; } #bigBurst img.cur.archive, #bigBurst img.cur.out { opacity: .75; }
  #final .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; max-width: 760px; }
  table { border-collapse: collapse; width: 100%; } td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); } td.n { text-align: right; }
  label.opt { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; cursor: pointer; }
</style>
</head>
<body>
<header>
  <a href="/">← OrderMyPhotos</a>
  <b>Review</b>
  <div class="tabs" id="tabs"><button data-f="open" class="on">To review</button><button data-f="confirmed">Confirmed</button><button data-f="all">All</button></div>
  <span class="muted" id="counts"></span>
  <span style="flex:1"></span>
  <button class="primary" id="finished" title="Accept everything not confirmed yet as it is, and go on">Finished</button>
  <label class="muted">size <input type="range" id="size" min="90" max="280" value="150" style="vertical-align: middle; padding: 0"></label>
</header>
<div class="layout" id="layout">
  <aside><input id="search" placeholder="Find an album or folder"><div id="units"></div></aside>
  <section class="main" id="main"><p class="muted">Pick an album or folder.</p></section>
</div>
<section class="main" id="final" hidden></section>

<dialog id="big"><div id="bigMain"><div id="bigBox"><img id="bigImg" alt=""><div id="bigBadge"></div><button class="nav prev" id="bigPrev" title="Previous (←)">‹</button><button class="nav next" id="bigNext" title="Next (→)">›</button><button class="close" id="bigClose" title="Close (Esc)">✕</button></div><div id="bigBurst"></div></div><div id="bigBar"><div class="info" id="bigInfo"></div><div id="bigActs"></div></div></dialog>
<dialog id="moveDlg">
  <b>Move to</b>
  <p class="muted" style="margin: 4px 0 8px">An album or folder, or type a new album name.</p>
  <input id="moveTo" list="targets" style="width: 420px; max-width: 80vw" autocomplete="off"><datalist id="targets"></datalist>
  <div style="margin-top: 10px; text-align: right"><button onclick="moveDlg.close()">Cancel</button> <button class="primary" onclick="doMove()">Move</button></div>
</dialog>

<script>
// Every change is saved on the server at once (P47): nothing is kept in the page, so leaving it loses nothing,
// and the review is the same from any device or browser.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let units = [], targets = [], filter = "open", cur = null, photos = [], focusIdx = -1, moving = null, unitsTimer = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function saved(ok, msg) {
  const el = $("saved");
  el.textContent = ok ? "Saved" : "Not saved: " + msg;
  el.className = ok ? "muted" : "err";
}

// --- the list of albums and folders ---
async function loadUnits() {
  const d = await api("/api/review/units");
  units = d.units; targets = d.targets;
  const p = d.pending;
  $("counts").textContent = `${p.unconfirmed} to review · ${p.units - p.unconfirmed} confirmed` + (p.to_sort ? ` · ${p.to_sort} photos to sort again` : "");
  $("targets").innerHTML = targets.map(t => `<option value="${esc(t)}">`).join("");
  drawUnits();
}
const refreshUnits = () => { clearTimeout(unitsTimer); unitsTimer = setTimeout(() => loadUnits().catch(() => {}), 1200); };
function drawUnits() {
  const q = $("search").value.toLowerCase();
  const shownUnits = units.filter(u => (filter === "all" || u.state === filter || (filter === "confirmed" && u.state === "dismantled"))
                                       && (!q || u.key.toLowerCase().includes(q) || u.name.toLowerCase().includes(q)));
  $("units").innerHTML = shownUnits.map(u => `<div class="unit ${cur && cur.key === u.key ? "sel" : ""}" data-k="${esc(u.key)}">
    <div class="t"><span class="dot ${u.state}"></span>${esc(u.name)}</div>
    <div class="s">${u.kind}${u.new ? " · new" : ""} · ${u.n} photos${u.open && u.state === "open" ? ` · ${u.open} to check` : ""}${u.unsure ? ` · ${u.unsure} unsure` : ""}${u.out ? ` · ${u.out} out` : ""}</div></div>`).join("")
    || `<p class="muted" style="padding: 0 12px">${filter === "open" ? "Nothing left to review here." : "None."}</p>`;
  for (const el of $("units").children) if (el.dataset.k) el.onclick = () => openUnit(el.dataset.k);
}

// --- one unit ---
async function openUnit(key) {
  const d = await api("/api/review/unit?key=" + encodeURIComponent(key));
  cur = d.unit; photos = d.photos; focusIdx = -1;
  history.replaceState(null, "", "#u=" + encodeURIComponent(key));
  window.scrollTo(0, 0);
  drawUnits(); drawUnit();
}

function tile(p, i) {
  const badges = [p.state === "open" && p.incoming ? `<span class="new">new</span>` : "", p.unsure ? `<span class="uns" title="${esc(p.unsure)}">unsure</span>` : "",
                  p.best ? "<span>★</span>" : "", p.sub ? `<span>${esc(p.sub.trim().replace("/", ""))}</span>` : ""].join("");
  return `<div class="ph ${p.verdict} ${p.state === "out" ? "out" : ""} ${i === focusIdx ? "focus" : ""}" data-i="${i}" title="${esc(p.name)}">
    <img loading="lazy" src="/api/photo/${p.id}/thumb" style="${p.rotate ? `transform: rotate(${p.rotate}deg)` : ""}" alt="">
    <div class="b">${badges}</div>
    <div class="tools"><button data-a="move" title="Move to… (M)">→</button><button data-a="out" title="Take out or put back (O)">✕</button></div></div>`;
}

// A burst is shown in one piece, where its first photo comes, even when other photos fall between its frames
// in time (messenger photos have a date and no time, so they sort by name): the grid, the arrows and the large
// view's burst column then all follow the burst.
function section(list) {
  const members = {};
  for (const p of list) if (p.gid != null) (members[p.gid] = members[p.gid] || []).push(p);
  const out = [], placed = new Set();
  for (const p of list) {
    const burst = p.gid != null ? members[p.gid] : null;
    if (burst && burst.length > 1) {
      if (placed.has(p.gid)) continue;
      placed.add(p.gid);
      out.push(`<div class="burst"><div class="lbl">burst of ${burst.length}</div>${burst.map(q => tile(q, photos.indexOf(q))).join("")}</div>`);
    } else out.push(`<div class="solo">${tile(p, photos.indexOf(p))}</div>`);
  }
  return `<div class="grid">${out.join("")}</div>`;
}

function summary() {
  const keep = photos.filter(p => p.verdict === "keep" && p.state !== "out").length, out = photos.filter(p => p.state === "out").length;
  const fresh = photos.filter(p => p.state === "open").length;
  return `${photos.length} photos · ${keep} kept · ${photos.length - keep - out} archived` + (out ? ` · ${out} taken out` : "")
    + (fresh && fresh < photos.length ? ` · ${fresh} to check` : "");
}

function drawUnit() {
  const u = cur, fresh = photos.filter(p => p.state !== "confirmed"), done = photos.filter(p => p.state === "confirmed");
  const nameOnly = u.kind === "album" && /^\d{4}-\d{2}-\d{2} /.test(u.name) ? u.name.slice(11) : u.name;
  $("main").innerHTML = `<div class="head">
      <input class="name" id="uname" value="${esc(nameOnly)}" title="Rename" ${u.state === "dismantled" ? "disabled" : ""}>
      <span class="tag">${u.kind}${u.new ? ", new" : ""}</span>
      ${u.state === "dismantled" ? `<span class="tag">dismantled</span>` : ""}
      <span style="flex:1"></span>
      <span id="saved" class="muted"></span>
      ${u.state === "open" ? `<button class="primary" onclick="confirmUnit()" title="Ctrl+Enter">Confirm</button>` : `<button onclick="reopen()">Review again</button>`}
      ${u.state !== "dismantled" ? `<button class="danger" onclick="dismantle()" title="Sort all its photos again">Dismantle</button>` : ""}
    </div>
    <div class="path">${esc(u.key)}</div>
    <div class="summary" id="summary">${summary()}</div>
    ${fresh.length ? section(fresh) : `<p class="muted">Everything here is confirmed.</p>`}
    ${done.length ? `<details class="done" ${fresh.length ? "" : "open"}><summary>Already confirmed (${done.length})</summary>${section(done)}</details>` : ""}
    <div class="help">Click to show large · right-click or <kbd>Space</kbd> to keep or archive · <kbd>O</kbd> take out or put back · <kbd>M</kbd> move · <kbd>Enter</kbd> or <kbd>Z</kbd> show large · <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> select · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> confirm · every change is saved at once</div>`;
  for (const el of $("main").querySelectorAll(".ph")) {
    el.onclick = e => {  // a click opens the photo large; the corner buttons do the rest
      const i = +el.dataset.i, a = e.target.dataset.a;
      setFocus(i);
      if (a === "move") return askMove(photos[i]);
      if (a === "out") return toggleOut(photos[i]);
      showBig(photos[i]);
    };
    el.oncontextmenu = e => { e.preventDefault(); setFocus(+el.dataset.i); toggleVerdict(photos[+el.dataset.i]); };  // right click: keep or archive
  }
  const name = $("uname");
  name.onchange = () => rename(name.value);
  name.onkeydown = e => { if (e.key === "Enter") name.blur(); };
  const tiles = shown();
  setFocus(tiles.some(el => +el.dataset.i === focusIdx) ? focusIdx : tiles.length ? +tiles[0].dataset.i : -1);
}

// One tile drawn again after a change, so the page doesn't jump.
function redraw(p) {
  const i = photos.indexOf(p), el = $("main").querySelector(`.ph[data-i="${i}"]`);
  if (!el) return drawUnit();
  el.className = `ph ${p.verdict} ${p.state === "out" ? "out" : ""} ${i === focusIdx ? "focus" : ""}`;
  $("summary").textContent = summary();
  if ($("big").open && photos[focusIdx] === p) bigInfo(p);
}

// The tiles as they're shown: the new ones first, then the confirmed ones when unfolded.
const shown = () => [...$("main").querySelectorAll(".ph")].filter(el => el.offsetParent !== null);

function setFocus(i) {
  focusIdx = i;
  for (const el of $("main").querySelectorAll(".ph.focus")) el.classList.remove("focus");
  const el = $("main").querySelector(`.ph[data-i="${i}"]`);
  if (el) { el.classList.add("focus"); el.scrollIntoView({block: "nearest", inline: "nearest"}); }
}

// Moves the selection the way the photos are laid out: left and right in reading order, up and down to the
// photo in the next row that's closest across.
function step(dir) {
  const tiles = shown();
  if (!tiles.length) return;
  let k = tiles.findIndex(el => +el.dataset.i === focusIdx);
  if (k < 0) return setFocus(+tiles[0].dataset.i);
  if (dir === "left" || dir === "right") {
    k = Math.max(0, Math.min(tiles.length - 1, k + (dir === "right" ? 1 : -1)));
  } else {
    const box = el => el.getBoundingClientRect();
    const r0 = box(tiles[k]), cx = r0.left + r0.width / 2;
    const ahead = tiles.filter(el => dir === "down" ? box(el).top > r0.top + r0.height / 2 : box(el).top < r0.top - r0.height / 2);
    if (!ahead.length) return;
    const y = dir === "down" ? Math.min(...ahead.map(el => box(el).top)) : Math.max(...ahead.map(el => box(el).top));
    const row = ahead.filter(el => Math.abs(box(el).top - y) < r0.height / 2);
    const across = el => Math.abs(box(el).left + box(el).width / 2 - cx);
    k = tiles.indexOf(row.reduce((a, b) => across(b) < across(a) ? b : a));
  }
  setFocus(+tiles[k].dataset.i);
}

// --- changes, each saved at once ---
async function act(p, action, target, undo) {
  try { await api("/api/review/photo", {key: cur.key, id: p.id, action, target}); saved(true); refreshUnits(); }
  catch (e) { undo(); redraw(p); saved(false, e.message); }
}
function toggleVerdict(p) {
  const was = p.verdict;
  p.verdict = was === "keep" ? "archive" : "keep";
  redraw(p);
  act(p, p.verdict, null, () => { p.verdict = was; });
}
function toggleOut(p) {
  const was = p.state;
  p.state = was === "out" ? "confirmed" : "out";  // put back: pinned here; out: sorted again in the next round
  redraw(p);
  act(p, was === "out" ? "back" : "out", null, () => { p.state = was; });
}
function askMove(p) { moving = p; $("moveTo").value = ""; $("moveDlg").showModal(); $("moveTo").focus(); }
async function doMove() {
  let t = $("moveTo").value.trim(); if (!t) return;
  if (!targets.includes(t) && !t.includes("/")) t = "new:" + t;  // a new album, dated by its photos
  $("moveDlg").close();
  const p = moving;
  try {
    await api("/api/review/photo", {key: cur.key, id: p.id, action: "move", target: t});
    const i = photos.indexOf(p);
    photos.splice(i, 1);
    focusIdx = Math.min(i, photos.length - 1);
    if ($("big").open) { if (photos.length) showBig(photos[focusIdx]); else $("big").close(); }
    drawUnit(); saved(true); refreshUnits();
  } catch (e) { saved(false, e.message); }
}
async function rename(name) {
  try { await api("/api/review/unit/rename", {key: cur.key, name: name.trim()}); saved(true); refreshUnits(); }
  catch (e) { saved(false, e.message); }
}

// --- large view: the arrows go on to the next photo ---
function showBig(p) {
  $("bigImg").src = `/api/photo/${p.id}/preview`;
  $("bigImg").dataset.rotate = p.rotate || 0;
  if (!$("big").open) $("big").showModal();
  fitBig();
  bigInfo(p);
}
function bigInfo(p) {
  const c = p.caption || {};
  $("bigInfo").innerHTML = `<b class="${p.verdict}">${p.state === "out" ? "Taken out" : p.verdict === "keep" ? "Kept" : "Archived"}</b> ·
    <b>${esc(c.title_en || p.name)}</b>${c.title_pl ? ` <span class="muted">· ${esc(c.title_pl)}</span>` : ""}
    <div>${esc(c.description_en || "")}</div>
    <div class="muted">${esc(p.taken || "")} · ${esc(p.from)}/${esc(p.name)}${p.why ? " · " + esc(p.why) : ""}${p.unsure ? " · unsure: " + esc(p.unsure) : ""}
    ${p.pipeline && p.pipeline !== p.verdict ? ` · the pipeline said ${p.pipeline}` : ""}${p.rotate ? ` · turned ${p.rotate}°` : ""}
    · <a href="/library/${p.path.split("/").map(encodeURIComponent).join("/")}" target="_blank">original</a></div>
    <div class="muted"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> as on the page · right-click or <kbd>Space</kbd> keep or archive · <kbd>O</kbd> take out · <kbd>Enter</kbd> or <kbd>Esc</kbd> close</div>`;
  const out = p.state === "out";
  $("bigBox").className = out ? "out" : p.verdict === "archive" ? "archive" : "";
  $("bigBadge").textContent = out ? "Taken out" : "Archived";
  $("bigActs").innerHTML = `<button data-a="verdict" class="on-${p.verdict}" title="Right-click or Space">${p.verdict === "keep" ? "Archive" : "Keep"}</button>
    <button data-a="out" title="O">${out ? "Put back" : "Take out"}</button><button data-a="move" title="M">Move to…</button>`;
  for (const b of $("bigActs").querySelectorAll("button")) b.onclick = () =>
    b.dataset.a === "verdict" ? toggleVerdict(p) : b.dataset.a === "out" ? toggleOut(p) : askMove(p);
  const order = shown().map(el => +el.dataset.i), k = order.indexOf(focusIdx);
  $("bigPrev").disabled = k <= 0; $("bigNext").disabled = k < 0 || k >= order.length - 1;
  burstPanel(p);
}
// The rest of the photo's burst, on the right: kept or archived, the one shown outlined. A click opens a
// frame, a right-click keeps or archives it.
function burstPanel(p) {
  const burst = p.gid != null ? photos.filter(q => q.gid === p.gid) : [], panel = $("bigBurst");
  panel.innerHTML = burst.length < 2 ? "single photo" : `<span>burst of ${burst.length}</span>` + burst.map(q => `<img src="/api/photo/${q.id}/thumb"
    data-i="${photos.indexOf(q)}" alt="" class="${q.verdict} ${q.state === "out" ? "out" : ""} ${q === p ? "cur" : ""}"
    title="${esc(q.name)}${q.best ? " ★" : ""}" style="${q.rotate ? `transform: rotate(${q.rotate}deg)` : ""}">`).join("");
  for (const img of panel.querySelectorAll("img")) {
    img.onclick = () => { setFocus(+img.dataset.i); showBig(photos[+img.dataset.i]); };
    img.oncontextmenu = e => { e.preventDefault(); toggleVerdict(photos[+img.dataset.i]); burstPanel(photos[focusIdx]); };
  }
  const cur = panel.querySelector("img.cur");
  if (cur) cur.scrollIntoView({block: "nearest"});
}

async function confirmUnit() {
  try {
    await api("/api/review/unit/confirm", {key: cur.key});
    await loadUnits();
    const next = units.find(u => u.state === "open");
    if (next) openUnit(next.key); else { cur = null; $("main").innerHTML = `<p><b>All albums and folders are confirmed.</b> Go back to <a href="/">OrderMyPhotos</a> and press <i>Done, go on</i>.</p>`; drawUnits(); }
  } catch (e) { saved(false, e.message); }
}
async function dismantle() {
  if (!confirm(`Dismantle "${cur.name}"? All ${photos.length} photos are sorted again, and nothing goes here any more.`)) return;
  try { await api("/api/review/unit/dismantle", {key: cur.key}); await loadUnits(); openUnit(cur.key).catch(() => {}); } catch (e) { saved(false, e.message); }
}
async function reopen() { try { await api("/api/review/unit/reopen", {key: cur.key}); await loadUnits(); openUnit(cur.key); } catch (e) { saved(false, e.message); } }

document.addEventListener("keydown", e => {
  if (e.target.id === "moveTo") { if (e.key === "Enter") doMove(); return; }
  if (!cur || e.target.tagName === "INPUT" || $("moveDlg").open) return;
  const big = $("big").open, p = photos[focusIdx];
  const arrow = {ArrowRight: "right", ArrowLeft: "left", ArrowDown: "down", ArrowUp: "up"}[e.key];
  if (arrow) {
    e.preventDefault();
    step(arrow);  // the same moves as on the page: the large view shows whatever is selected there
    if (big && photos[focusIdx]) showBig(photos[focusIdx]);
  }
  else if (!p) return;
  else if (e.key === "k" || e.key === "a" || e.key === " ") { e.preventDefault(); toggleVerdict(p); }
  else if (e.key === "o") toggleOut(p);
  else if (e.key === "m") { e.preventDefault(); askMove(p); }
  else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { if (!big && cur.state === "open") confirmUnit(); }  // on purpose only
  else if (e.key === "z" || e.key === "Enter") { e.preventDefault(); if (big) $("big").close(); else showBig(p); }
});
$("bigClose").onclick = () => $("big").close();
for (const [id, dir] of [["bigPrev", "left"], ["bigNext", "right"]])
  $(id).onclick = () => { step(dir); if (photos[focusIdx]) showBig(photos[focusIdx]); };
$("bigBox").oncontextmenu = e => { e.preventDefault(); if (photos[focusIdx]) toggleVerdict(photos[focusIdx]); };
// The photo fitted to the frame; a photo turned a quarter is laid out with the sides swapped, then turned.
function fitBig() {
  const img = $("bigImg"), box = $("bigBox").getBoundingClientRect(), turn = +img.dataset.rotate || 0, side = turn % 180 !== 0;
  img.style.width = (side ? box.height : box.width) + "px";
  img.style.height = (side ? box.width : box.height) + "px";
  img.style.transform = `translate(-50%, -50%) rotate(${turn}deg)`;
}
window.addEventListener("resize", () => { if ($("big").open) fitBig(); });
$("search").oninput = drawUnits;
$("size").oninput = e => document.documentElement.style.setProperty("--size", e.target.value + "px");
// Finished: everything not confirmed yet is accepted as it is, and the run goes on (to sorting the photos taken
// out, or to the plan); the wizard shows it.
$("finished").onclick = async () => {
  const left = units.filter(u => u.state === "open").length;
  if (!confirm(left ? `Accept the ${left} albums and folders not confirmed yet, as they are now, and go on?` : "Go on with the run?")) return;
  try { await api("/api/phase/review/finish", {}); location.assign("/"); } catch (e) { alert(e.message); }
};
for (const b of $("tabs").children) b.onclick = () => { filter = b.dataset.f; for (const x of $("tabs").children) x.classList.toggle("on", x === b); drawUnits(); };

// --- the final decision ---
async function showFinal() {
  $("layout").hidden = true; $("tabs").hidden = true; $("final").hidden = false;
  let plan;
  try { plan = await api("/api/review/plan"); } catch (e) { $("final").innerHTML = `<p>${esc(e.message)}</p>`; return; }
  const c = plan.counts, gb = b => (b / 2 ** 30).toFixed(1) + " GiB";
  $("final").innerHTML = `<div class="card"><h2 style="margin-top:0">The plan</h2>
      <table><tr><td>Photos moved to albums and folders</td><td class="n">${(c.create || 0) + (c.add || 0) + (c.theme || 0) + (c.place || 0)}</td></tr>
      <tr><td>Photos that stay where they are</td><td class="n">${c.stays || 0}</td></tr>
      <tr><td>Photos archived</td><td class="n">${plan.archive.n} (${gb(plan.archive.bytes)})</td></tr>
      <tr><td>Photos turned upright</td><td class="n">${plan.rotations}</td></tr></table>
      <details style="margin-top:10px"><summary class="muted">Where they go</summary><table>${plan.targets.map(([t, n]) => `<tr><td>${esc(t)}</td><td class="n">${n}</td></tr>`).join("")}</table></details></div>
    <div class="card"><h2 style="margin-top:0">The archived photos</h2>
      <label class="opt"><input type="radio" name="arch" value="keep" checked> Keep them in <code>Archive/OrderMyPhotos/</code>, where they can be restored</label>
      <label class="opt"><input type="radio" name="arch" value="delete"> Delete them once the plan is applied</label>
      <p class="muted">Applying the plan to the library is a separate step (not built yet); this records your decision.</p>
      <button class="primary" onclick="finish()">Save the decision</button> <a href="/" style="margin-left:10px">Back</a></div>`;
}
async function finish() {
  const arch = document.querySelector("input[name=arch]:checked").value;
  if (arch === "delete" && !confirm("Delete the archived photos once the plan is applied?")) return;
  try { await api("/api/phase/final/done", {archived: arch}); location.assign("/"); } catch (e) { alert(e.message); }
}

if (location.hash === "#final") showFinal();
else loadUnits().then(() => {
  const m = location.hash.match(/^#u=(.+)$/);
  const key = m ? decodeURIComponent(m[1]) : (units.find(u => u.state === "open") || {}).key;
  if (key) openUnit(key);
}).catch(e => { $("main").innerHTML = `<p>${esc(e.message)}</p>`; });
</script>
</body>
</html>
