# The thematic folders S11 starts from (decisions.md P38), each with what it's for: the description is
# what photos are sorted by, so it says what belongs and what doesn't. A library's own folders come on top
# of these. <year> is the year of the photo: Pictures/Other/2022.
Pictures/Info/Documents: Documents kept for information - letters, forms, contracts, certificates, official papers.
Pictures/Info/Paragony: Receipts, invoices and bills, warranty cards.
Pictures/Info/Hardware: Electronics and devices, their insides, labels, serial numbers, cables and specs.
Pictures/Info/Screens: Photos of screens, monitors, slides and whiteboards, kept for what they show.
Pictures/Info/Notes: Things to remember - a parking spot, a price, a product to look up, handwritten notes.
Pictures/Info/Maps: Maps, trail maps, route topos, timetables and plans.
Pictures/Info/Notices: Public notices, signs, posters and adverts photographed for their information (for sale, announcements, inspections).
Pictures/Other/Food: Dishes and drinks photographed for the food itself, not for an occasion (a dinner out is an event).
Pictures/Other/Cats: Cats that aren't the owner's own pet - cats met outside, friends' cats, cats for adoption, cat pictures. The owner's own pet gets a folder of its own.
Pictures/Other/Animals: Other animals - dogs, birds, insects, wildlife, the zoo - that aren't the owner's own pet.
Pictures/Other/Views: Landscapes, skylines, sunsets and wide views - no person and no object as the subject.
Pictures/Other/City: Streets, buildings, traffic and city life on an ordinary day, without an event.
Pictures/Other/Nature: Plants, flowers, trees, mushrooms and close-ups of nature.
Pictures/Other/Sport: Training and sport on an ordinary day - the gym, a climbing wall, exercise - when it isn't an event.
Pictures/Other/Vehicles: Cars, bikes and vans, their parts and repairs.
Pictures/Other/Home: The home itself - rooms, furniture, repairs, renovation, installations.
Pictures/Other/Shopping: Products in shops, things considered or bought, price tags.
Pictures/Other/Clothes: Clothes and outfits, tried on or bought.
Pictures/Other/Meme: Memes and funny pictures, mostly downloaded or forwarded.
Pictures/Other/Art: Art, drawings, illustrations and graphics.
Pictures/Albums/Screeshots: Screenshots from a phone or a computer.
Pictures/Other/Random: Truly random photos that make no sense - accidental shots, a pocket, a blurry nothing. Not for photos that just belong nowhere.
Pictures/Other/<year>: Single photos of that year that are fine but belong to no event and to no other folder.
