<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderMyPhotos review</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #deded8;
  --keep: #1f8a4c; --archive: #8a8a84; --bad: #c2412d; --accent: #2f5fd0; --warn: #b7791f;
  --focus: #2f5fd0; --chip: #efefea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1e1e1c; --ink: #ecece8; --muted: #a3a39c; --line: #34342f;
    --keep: #3fbf74; --archive: #77776f; --bad: #ef6a52; --accent: #7aa2ff; --warn: #e0a84a;
    --focus: #7aa2ff; --chip: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1e1e1c; --ink: #ecece8; --muted: #a3a39c; --line: #34342f;
  --keep: #3fbf74; --archive: #77776f; --bad: #ef6a52; --accent: #7aa2ff; --warn: #e0a84a;
  --focus: #7aa2ff; --chip: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .stats { color: var(--muted); }
header .spacer { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 12px 16px 80px; max-width: 1600px; margin: 0 auto; }
.intro { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
.intro p { margin: 4px 0; }
.intro kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
details.tim { color: var(--muted); margin-top: 6px; }
h2 { font-size: 15px; margin: 22px 0 8px; font-weight: 600; }
h2 small { color: var(--muted); font-weight: 400; }
.flow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.burst { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.burst .bh { font-size: 12px; color: var(--muted); margin: 0 2px 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.burst .bh b { color: var(--ink); }
.burst .strip { display: flex; flex-wrap: wrap; gap: 8px; }
.card { width: var(--card, 340px); background: var(--panel); border: 3px solid var(--line); border-radius: 8px; overflow: hidden; outline: none; }
header input[type=range] { width: 120px; vertical-align: middle; }
.single { border-radius: 8px; }
.card.keep { border-color: var(--keep); }
.card.archive { border-color: var(--archive); }
.card.bad { border-color: var(--bad); }
.card:not(.confirmed) { border-style: dashed; }
.card.cur { box-shadow: 0 0 0 3px var(--focus); }
.card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; cursor: zoom-in; }
.card .m { padding: 5px 7px 7px; font-size: 12px; }
.card .t { display: flex; justify-content: space-between; color: var(--muted); }
.card .cap { margin: 2px 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: 3px; margin: 3px 0; min-height: 18px; }
.b { font-size: 11px; padding: 0 5px; border-radius: 9px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.b.best { background: var(--keep); color: #fff; }
.b.floor { background: var(--bad); color: #fff; }
.b.rev { background: var(--warn); color: #fff; }
.b.ref { background: var(--accent); color: #fff; }
.act { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
.act button { padding: 1px 7px; font-size: 12px; }
.act button.on.k { background: var(--keep); color: #fff; border-color: var(--keep); }
.act button.on.a { background: var(--archive); color: #fff; border-color: var(--archive); }
.act button.on.x { background: var(--bad); color: #fff; border-color: var(--bad); }
.act input { width: 52px; padding: 1px 4px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.why { font-size: 11px; color: var(--muted); margin-top: 3px; }
#lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 10; display: none; color: #eee; }
#lb.open { display: flex; }
#lb .img { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
#lb img { max-width: 100%; max-height: 100vh; object-fit: contain; }
#lb aside { width: 380px; max-width: 45vw; overflow: auto; padding: 14px 16px; background: #1b1b1a; font-size: 13px; }
#lb aside h3 { margin: 0 0 6px; font-size: 15px; }
#lb aside .k { color: #9d9d96; }
#lb aside ul { padding-left: 18px; margin: 4px 0; }
#lb aside pre { white-space: pre-wrap; font-size: 12px; background: #111; padding: 6px; border-radius: 4px; }
#lb aside button { background: #2c2c2a; border-color: #444; }
#lb .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; margin: 6px 0 10px; }
#lb .mini { border: 3px solid #555; border-radius: 6px; overflow: hidden; cursor: pointer; background: #000; }
#lb .mini.keep { border-color: var(--keep); }
#lb .mini.archive { border-color: var(--archive); }
#lb .mini.bad { border-color: var(--bad); }
#lb .mini:not(.confirmed) { border-style: dashed; }
#lb .mini.here { outline: 3px solid #fff; outline-offset: 1px; }
#lb .mini img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
#lb .mini div { font-size: 11px; padding: 1px 4px; color: #ccc; display: flex; justify-content: space-between; }
#lb .close { position: absolute; top: 8px; right: 12px; }
@media (max-width: 700px) {
  .card { width: min(var(--card, 340px), calc(100vw - 54px)); }
  #lb { flex-direction: column; }
  #lb aside { width: 100%; max-width: none; max-height: 45vh; }
  #lb img { max-height: 55vh; }
}
</style>
</head>
<body>
<header>
  <a href="../index.html" title="all albums">← Albums</a>
  <h1 id="title">Review</h1>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <label title="thumbnail size">Size <input type="range" id="size" min="180" max="720" step="20"></label>
  <label>Show <select id="filter"><option value="all">all</option><option value="review">needs review</option><option value="archive">archive proposals</option><option value="open">not labelled yet</option></select></label>
  <button id="trust" title="accept every proposal you haven't labelled">Trust automatic picks</button>
  <button id="imp">Load labels…</button><input type="file" id="impf" accept=".json" hidden>
  <button class="primary" id="exp">Export labels</button>
</header>
<main>
  <div class="intro" id="intro"></div>
  <div id="list"></div>
</main>
<div id="lb"><div class="img"><img id="lbimg" alt=""></div><aside id="lbside"></aside><button class="close" id="lbx">✕ Esc</button></div>
<script>
const DATA = /*DATA*/null;
const B = DATA.base || "";  // where t/ m/ p/ are, relative to this page
const KEY = "omp-labels-" + DATA.run + "::" + DATA.album;
const items = DATA.items;
const byName = Object.fromEntries(items.map(x => [x.name, x]));
let labels = {};
try {
  labels = JSON.parse(localStorage.getItem(KEY) || "null");
  if (!labels) {  // labels made on the first, single-album page (key without the album) move here
    const old = JSON.parse(localStorage.getItem("omp-labels-" + DATA.run) || "{}");
    labels = Object.fromEntries(Object.entries(old).filter(([n]) => byName[n]));
    // Otherwise start from the labels already imported into the DB (omp labels), e.g. for a new run.
    if (!Object.keys(labels).length) labels = Object.assign({}, DATA.user_labels || {});
    if (Object.keys(labels).length) localStorage.setItem(KEY, JSON.stringify(labels));
  }
} catch (e) { labels = Object.assign({}, DATA.user_labels || {}); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {} render(); };
const L = x => labels[x.name] || {};
const verdictOf = x => L(x).verdict || x.verdict;
const groupOf = x => (L(x).group !== undefined ? L(x).group : x.group);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let order = [], cur = 0, lbOpen = false;

function setLabel(x, patch) {
  const base = labels[x.name] || {group: x.group, verdict: x.verdict};
  labels[x.name] = Object.assign(base, patch, {confirmed: true});
  save();
}
function acceptGroup(x) {
  const g = groupOf(x);
  const members = g ? items.filter(y => groupOf(y) === g) : [x];
  members.forEach(y => { labels[y.name] = Object.assign(labels[y.name] || {group: y.group, verdict: y.verdict}, {confirmed: true}); });
  save();
}

function badges(x) {
  const b = [];
  if (x.group && x.rank === 0) b.push('<span class="b best">best</span>');
  if (x.tier === "review") b.push('<span class="b rev">review</span>');
  if (x.floor) b.push('<span class="b floor">floor</span>');
  if (x.protected) b.push('<span class="b floor" title="' + esc(x.protected) + '">protected</span>');
  if ((x.cap && x.cap.purpose && x.cap.purpose !== "memory") || (!x.cap && x.f.purpose && x.f.purpose !== "memory"))
    b.push('<span class="b ref">' + esc((x.cap && x.cap.category !== "none" && x.cap.category) || (x.cap && x.cap.purpose) || x.f.purpose) + '</span>');
  if (L(x).confirmed && L(x).verdict && L(x).verdict !== x.verdict) b.push('<span class="b rev" title="your label differs from the proposal">pipeline: ' + esc(x.verdict) + '</span>');
  if (x.v1) b.push('<span class="b" title="v1 burst culling">v1 ' + (x.v1 === "kept" ? "kept" : "archived") + '</span>');
  if (x.f.bt != null) b.push('<span class="b" title="VLM Bradley–Terry share">VLM ' + Math.round(x.f.bt * 100) + '%</span>');
  if (x.f.p_keep != null) b.push('<span class="b" title="VLM: worth keeping">keep? ' + Math.round(x.f.p_keep * 100) + '%</span>');
  return b.join("");
}
function card(x) {
  const v = verdictOf(x), l = L(x);
  return `<div class="card ${v === "bad" ? "bad" : v} ${l.confirmed ? "confirmed" : ""}" data-n="${esc(x.name)}" tabindex="-1">
    <img loading="lazy" src="${B}t/${x.id}.jpg" alt="${esc(x.name)}">
    <div class="m"><div class="t"><span>${x.time}</span><span>${esc(x.name.replace(/\.[^.]+$/, "").slice(-6))}${x.v1_archived ? " ·_arch" : ""}</span></div>
    ${x.cap ? `<div class="cap" title="${esc(x.cap.title_pl)}">${esc(x.cap.title_pl)}</div>` : ""}
    <div class="badges">${badges(x)}</div>
    <div class="act"><button class="k ${v === "keep" ? "on" : ""}" data-v="keep" title="k">Keep</button><button class="a ${v === "archive" ? "on" : ""}" data-v="archive" title="a">Arch</button><button class="x ${v === "bad" ? "on" : ""}" data-v="bad" title="b: bad on its own">Bad</button>
    <input value="${esc(groupOf(x))}" title="burst label; g = same as previous photo, n = none" placeholder="—"></div>
    <div class="why">${esc((x.reasons || [])[0] || "")}</div></div></div>`;
}
function visible(x) {
  const f = document.getElementById("filter").value;
  if (f === "review") return x.tier === "review";
  if (f === "archive") return verdictOf(x) !== "keep";
  if (f === "open") return !L(x).confirmed;
  return true;
}
function render() {
  const done = items.filter(x => L(x).confirmed).length;
  const keep = items.filter(x => verdictOf(x) === "keep").length;
  document.getElementById("stats").textContent = `${items.length} photos · keep ${keep} · archive ${items.length - keep} · labelled ${done}/${items.length}`;
  const events = {};
  items.forEach(x => (events[x.event] = events[x.event] || []).push(x));
  const out = [];
  order = [];
  for (const [ev, xs] of Object.entries(events)) {
    const shown = xs.filter(visible);
    if (!shown.length) continue;
    out.push(`<h2>Event ${+ev + 1} <small>${xs[0].date} · ${xs[0].time.slice(0, 5)}–${xs[xs.length - 1].time.slice(0, 5)} · ${xs.length} photos</small></h2><div class="flow">`);
    const seen = new Set();
    for (const x of xs) {
      if (seen.has(x.name)) continue;
      const g = groupOf(x);
      if (g) {
        const members = xs.filter(y => groupOf(y) === g);
        members.forEach(y => seen.add(y.name));
        const vis = members.filter(visible);
        if (!vis.length) continue;
        const info = DATA.bursts[g];
        const head = info ? `<b>${g}</b><span>${members.length} photos</span><span>${info.span} s</span><span title="mean margin over the similarity threshold">cohesion ${info.cohesion.toFixed(3)}</span>${info.min < 0.02 ? '<span class="b rev">loose</span>' : ""}` : `<b>${esc(g)}</b><span>${members.length} photos (your group)</span>`;
        out.push(`<div class="burst"><div class="bh">${head}<button class="acc" data-n="${esc(x.name)}" title="Enter">Accept burst</button></div><div class="strip">${vis.map(y => (order.push(y), card(y))).join("")}</div></div>`);
      } else if (visible(x)) {
        seen.add(x.name); order.push(x); out.push(card(x));
      }
    }
    out.push("</div>");
  }
  document.getElementById("list").innerHTML = out.join("");
  cur = Math.min(cur, Math.max(order.length - 1, 0));
  focusCur(false);
  if (lbOpen) showLb();
}
function focusCur(scroll = true) {
  document.querySelectorAll(".card.cur").forEach(e => e.classList.remove("cur"));
  const x = order[cur]; if (!x) return;
  const el = document.querySelector(`.card[data-n="${CSS.escape(x.name)}"]`);
  if (el) { el.classList.add("cur"); if (scroll) el.scrollIntoView({block: "nearest", behavior: "smooth"}); }
}
let lbItem = null;  // the photo in the open view; a click on a burst thumbnail can open one outside `order`
function strip(x) {
  // The photo's burst (as labelled now), or the photos around a single, to compare without closing the view.
  const g = groupOf(x);
  const i = items.indexOf(x);
  const members = g ? items.filter(y => groupOf(y) === g) : items.slice(Math.max(0, i - 2), i + 3);
  const head = g ? `Burst ${esc(g)} · ${members.length} photos` : "Single · the photos around it";
  return `<div class="k">${head}</div><div class="strip">${members.map(y => {
    const ly = L(y), vy = verdictOf(y);
    return `<div class="mini ${vy} ${ly.confirmed ? "confirmed" : ""} ${y === x ? "here" : ""}" data-n="${esc(y.name)}" title="${esc(y.name)}">
      <img src="${B}t/${y.id}.jpg" alt=""><div><span>${y.time}</span><span>${vy}</span></div></div>`;
  }).join("")}</div>`;
}
function showLb(x = lbItem && lbOpen ? lbItem : order[cur]) {
  if (!x) return;
  lbItem = x;
  lbOpen = true;
  document.getElementById("lb").classList.add("open");
  const im = document.getElementById("lbimg");
  im.onerror = () => { im.onerror = null; im.src = B + "t/" + x.id + ".jpg"; };  // original not reachable: thumbnail
  im.src = x.src;
  const c = x.cap, f = x.f, v = verdictOf(x);
  const num = (k, d = 2) => f[k] == null ? "–" : (+f[k]).toFixed(d);
  const cats = ["none", "documents", "receipts", "labels", "specs", "screens", "home", "to_remember", "maps_topos", "food", "shopping", "memes"];
  const curCat = L(x).category || (c && c.category) || "none";
  document.getElementById("lbside").innerHTML = `
    <h3>${esc(x.name)}</h3><div class="k">${x.date} ${x.time} · ${x.group ? "burst " + x.group + ", rank " + (x.rank + 1) : "single"} · ${x.tier}</div>
    <p><button data-v="keep">Keep (k)</button> <button data-v="archive">Archive (a)</button> <button data-v="bad">Bad (b)</button> — now <b>${v}</b>${L(x).confirmed ? " ✓" : " (proposed)"}${L(x).confirmed && L(x).verdict !== x.verdict ? ` · pipeline: ${x.verdict}` : ""}</p>
    ${strip(x)}
    <div class="k">Why</div><ul>${(x.reasons || []).map(r => "<li>" + esc(r) + "</li>").join("")}</ul>
    ${x.floor ? `<div class="k">Quality floor</div><ul>${x.floor.map(r => "<li>" + esc(r) + "</li>").join("")}</ul>` : ""}
    <div class="k">Signals</div><div>sharp ${num("sharp")} (vs best ${num("rel_sharp")}) · quality ${num("quality")} · aesthetics ${num("aesthetics")} · motion ${num("motion")} · faces ${f.faces ?? 0} · kind ${esc(f.purpose)} (${num("memory_p")})</div>
    ${c ? `<div class="k" style="margin-top:8px">Caption</div><div><b>${esc(c.title_pl)}</b> / ${esc(c.title_en)}</div><p>${esc(c.description_pl)}</p><p class="k">${esc(c.description_en)}</p>
      <div class="k">Tags</div><div>${c.tags.map(t => '<span class="b">' + esc(t) + "</span>").join(" ")}</div>
      ${c.names && c.names.length ? `<div class="k">Names</div><div>${c.names.map(esc).join(", ")}</div>` : ""}
      ${c.text_in_image ? `<div class="k">Text in image</div><pre>${esc(c.text_in_image)}</pre>` : ""}` : `<p class="k">No caption (proposed for the archive).</p>`}
    <div class="k" style="margin-top:8px">Category (reference photos)</div>
    <select id="cat">${cats.map(k => `<option ${k === curCat ? "selected" : ""}>${k}</option>`).join("")}</select>
    <div class="k" style="margin-top:8px">Note</div><input id="note" style="width:100%" value="${esc(L(x).note || "")}">
    <p class="k">v1: ${x.v1 || "not in a v1 burst"}${x.v1_archived ? " (in _archived/)" : ""}</p>
    <p class="k">← → move · k a b set · Enter accept burst · Esc close</p>`;
  document.querySelectorAll("#lbside button[data-v]").forEach(b => b.onclick = () => setLabel(x, {verdict: b.dataset.v}));
  document.querySelectorAll("#lbside .mini").forEach(m => m.onclick = () => {
    const y = byName[m.dataset.n];
    if (order.includes(y)) { cur = order.indexOf(y); focusCur(); }
    showLb(y);
  });
  document.getElementById("cat").onchange = e => setLabel(x, {category: e.target.value});
  document.getElementById("note").onchange = e => setLabel(x, {note: e.target.value});
}
function closeLb() { lbOpen = false; document.getElementById("lb").classList.remove("open"); }

document.getElementById("list").addEventListener("click", e => {
  const el = e.target.closest(".card");
  if (e.target.classList.contains("acc")) { acceptGroup(byName[e.target.dataset.n]); return; }
  if (!el) return;
  const x = byName[el.dataset.n];
  cur = order.indexOf(x); focusCur(false);
  if (e.target.dataset.v) setLabel(x, {verdict: e.target.dataset.v});
  else if (e.target.tagName === "IMG") showLb();
});
document.getElementById("list").addEventListener("change", e => {
  if (e.target.tagName !== "INPUT") return;
  const x = byName[e.target.closest(".card").dataset.n];
  setLabel(x, {group: e.target.value.trim()});
});
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) { if (e.key === "Escape") document.activeElement.blur(); return; }
  const x = lbOpen && lbItem ? lbItem : order[cur]; if (!x) return;
  const k = e.key;
  const step = d => {
    const i = order.indexOf(x);
    cur = Math.min(Math.max((i < 0 ? cur : i) + d, 0), order.length - 1);
    focusCur(); if (lbOpen) showLb(order[cur]);
  };
  if (k === "ArrowRight") step(1);
  else if (k === "ArrowLeft") step(-1);
  else if (k === "k") setLabel(x, {verdict: "keep"});
  else if (k === "a") setLabel(x, {verdict: "archive"});
  else if (k === "b") setLabel(x, {verdict: "bad"});
  else if (k === "g" && cur > 0) { const prev = order[cur - 1]; setLabel(x, {group: groupOf(prev) || ("U" + prev.name.slice(9, 15))}); if (!groupOf(prev)) setLabel(prev, {group: "U" + prev.name.slice(9, 15)}); }
  else if (k === "n") setLabel(x, {group: ""});
  else if (k === "Enter") acceptGroup(x);
  else if (k === " " || k === "z") { e.preventDefault(); lbOpen ? closeLb() : showLb(); }
  else if (k === "Escape") closeLb();
  else return;
  e.preventDefault();
});
document.getElementById("lbx").onclick = closeLb;
document.getElementById("filter").onchange = render;
const sizeEl = document.getElementById("size");
const applySize = v => document.documentElement.style.setProperty("--card", v + "px");
let size = 340;
try { size = +localStorage.getItem("omp-card-size") || 340; } catch (e) {}
sizeEl.value = size; applySize(size);
sizeEl.oninput = e => { applySize(e.target.value); try { localStorage.setItem("omp-card-size", e.target.value); } catch (err) {} };
document.getElementById("trust").onclick = () => {
  items.forEach(y => { if (!L(y).confirmed) labels[y.name] = {group: y.group, verdict: y.verdict, confirmed: true, trusted: true}; });
  try { localStorage.setItem(KEY + "::trusted", "true"); } catch (e) {}
  save();
};
document.getElementById("exp").onclick = () => {
  const blob = new Blob([JSON.stringify({run: DATA.run, album: DATA.album, exported: new Date().toISOString(), labels}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `labels-${DATA.run}-${DATA.album.split("/").pop()}.json`; a.click();
};
document.getElementById("imp").onclick = () => document.getElementById("impf").click();
document.getElementById("impf").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); labels = j.labels || {}; save(); } catch (err) { alert("Not a labels file: " + err); }
};

document.getElementById("title").textContent = DATA.album.split("/").pop();
document.getElementById("intro").innerHTML = `
